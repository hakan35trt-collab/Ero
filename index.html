<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080b"><title>ERO</title><style>
*{box-sizing:border-box}body{margin:0;background:#05080b;color:#d9e9ed;font:16px system-ui;overflow:hidden;height:100dvh}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.status{position:absolute;top:16px;right:18px;width:11px;height:11px;border-radius:50%;background:#64717b;box-shadow:0 0 12px currentColor}.status.on{background:#34d399}.face{width:100%;height:70vh;display:flex;align-items:center;justify-content:center;gap:9vw;transition:.25s}.eye{width:min(25vw,150px);height:min(15vw,88px);min-width:80px;min-height:44px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#baf9ff 0,#66d9e8 35%,#1795a8 70%,#05384a 100%);box-shadow:0 0 40px #12a4bb70;position:relative;overflow:hidden;transform:scaleY(1);transition:transform .18s}.pupil{position:absolute;left:50%;top:50%;width:45%;height:68%;border-radius:50%;background:#020a14;transform:translate(-50%,-50%);transition:all .12s}.speaking .eye{animation:talkEyes .32s infinite alternate}.listening .eye{box-shadow:0 0 65px #36bfffa8;transform:scale(1.12)}.blink .eye{transform:scaleY(.08)}@keyframes talkEyes{from{transform:scaleY(.92)}to{transform:scaleY(1.08)}}.wave{position:absolute;bottom:18%;display:flex;gap:4px;align-items:center;height:28px;opacity:0;transition:.2s}.wave.show{opacity:1}.wave span{width:3px;height:5px;border-radius:4px;background:#9eeaf4;animation:wave .5s infinite alternate}.wave span:nth-child(2n){animation-delay:.12s}.wave span:nth-child(3n){animation-delay:.22s}@keyframes wave{to{height:24px}}#drawer{position:absolute;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5}#panel{background:#111820;border:1px solid #303c48;border-radius:22px 22px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));width:100%;max-height:78dvh;overflow:auto}#panel h2{margin:0 0 14px}.field{margin:12px 0}.field label{display:block;color:#9baab5;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;background:#05090d;border:1px solid #303b46;border-radius:12px;color:#eaf2f6;padding:13px;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap}button{background:#18222b;border:1px solid #35414b;color:#e8f0f3;padding:12px 15px;border-radius:13px;font:inherit}button.gold{background:#d9b86c;color:#101216;border:0}.small{font-size:12px;color:#8c9aa5}.topmenu{position:absolute;top:12px;left:12px;border:0;background:transparent;font-size:24px;color:#77848e}.chatbox{position:absolute;bottom:7%;width:90%;max-height:25vh;overflow:auto;text-align:center;font-size:15px;line-height:1.5;color:#c7d6dd}.chatbox:empty{display:none}.user{color:#d9b86c}.err{color:#ff9b9b}.hide{display:none}
</style></head><body><div id="app"><button class="topmenu" id="menu" aria-label="Ayarlar">⋮</button><div class="status" id="status"></div><div class="face" id="face"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="wave" id="wave"></div><div class="chatbox" id="chat"></div><div id="drawer"><div id="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>ERO Gizli Ayarlar</h2><button id="close">Kapat ✕</button></div><div class="field"><label>Gemini API anahtarı</label><input id="key" type="password" autocomplete="off" placeholder="API anahtarını bir kez gir"></div><div class="field"><label>Model</label><select id="model"><option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (hızlı)</option></select></div><div class="field"><label>Türkçe ses</label><select id="voice"></select></div><div class="field"><label>ERO karakter ayarı</label><textarea id="persona" rows="3">ERO'sun. Türkçe konuş, kısa, doğal, zeki, samimi ve net cevap ver. Gereksiz uzatma. Sesli konuşmada gündelik ve insan gibi konuş.</textarea></div><div class="row"><button id="save">Ayarları kaydet</button><button id="test">Gemini bağlantısını test et</button><button id="mic">Mikrofonu başlat</button><button id="stop">Sesi durdur</button></div><p id="info" class="small"></p><p class="small">Ana ekranda yalnızca ERO'nun gözleri görünür. Mikrofonu ilk kez başlatmak için izin gerekir. “ERO” diye seslenince dinleyip yanıt vermeyi deneyecektir. Tarayıcı mikrofonu arka planda/ekran kapalıyken kısıtlayabilir.</p></div></div></div>
<script>
const $=id=>document.getElementById(id);const drawer=$('drawer'),face=$('face'),chat=$('chat'),status=$('status'),wave=$('wave');let voices=[],speechOn=true,rec=null,continuous=false,awaitingWake=true,apiKey=localStorage.getItem('ero_gemini_key')||''; $('key').value=apiKey; $('model').value=localStorage.getItem('ero_model')||'gemini-3.5-flash-lite';$('persona').value=localStorage.getItem('ero_persona')||$('persona').value;
for(let i=0;i<14;i++){let s=document.createElement('span');wave.appendChild(s)}
function loadVoices(){voices=speechSynthesis?.getVoices()||[];$('voice').innerHTML='';const tr=voices.filter(v=>v.lang.toLowerCase().startsWith('tr'));(tr.length?tr:voices).forEach(v=>{let o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';$('voice').append(o)});let saved=localStorage.getItem('ero_voice');if(saved&&voices.some(v=>v.name===saved))$('voice').value=saved}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(t){if(!speechOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=1;u.pitch=.94;u.volume=1;let v=voices.find(v=>v.name===$('voice').value);if(v)u.voice=v;u.onstart=()=>{face.classList.add('speaking');wave.classList.add('show')};u.onend=u.onerror=()=>{face.classList.remove('speaking');wave.classList.remove('show')};speechSynthesis.speak(u)}
function eyesBlink(){face.classList.add('blink');setTimeout(()=>face.classList.remove('blink'),150)}setInterval(()=>{if(!face.classList.contains('speaking')&&!face.classList.contains('listening'))eyesBlink()},4800+Math.random()*3000);
function openMenu(){drawer.style.display='flex'}$('menu').onclick=openMenu;$('close').onclick=()=>drawer.style.display='none';drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.style.display='none'});
$('save').onclick=()=>{apiKey=$('key').value.trim();localStorage.setItem('ero_gemini_key',apiKey);localStorage.setItem('ero_model',$('model').value);localStorage.setItem('ero_persona',$('persona').value);localStorage.setItem('ero_voice',$('voice').value);$('info').textContent='Ayarlar bu cihazda kaydedildi.'};
async function gemini(prompt){if(!apiKey)throw new Error('Gizli menüden API anahtarını girip kaydet.');let url='https://generativelanguage.googleapis.com/v1beta/models/'+$('model').value+':generateContent?key='+encodeURIComponent(apiKey);let res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:$('persona').value}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.75,maxOutputTokens:220}})});let data=await res.json();if(!res.ok)throw new Error(data.error?.message||'API hatası '+res.status);return data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim()||'Yanıt alamadım.'}
$('test').onclick=async()=>{try{$('info').textContent='Bağlantı deneniyor…';let answer=await gemini('Sadece “ERO bağlantısı tamam.” de.');$('info').textContent=answer}catch(e){$('info').textContent='Hata: '+e.message}};
function showText(t,kind=''){chat.innerHTML='';let d=document.createElement('div');d.className=kind;d.textContent=t;chat.append(d)}
async function handleUtterance(text){text=text.trim();if(!text)return;showText('Sen: '+text,'user');try{let answer=await gemini(text);showText(answer);say(answer)}catch(e){showText('Bağlantı hatası: '+e.message,'err');say('Bağlantı hatası. Ayarları kontrol et.')}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startMic(){if(!SR){$('info').textContent='Bu tarayıcı ses tanımayı desteklemiyor. Chrome ile GitHub Pages adresini aç.';return}if(!apiKey){openMenu();$('info').textContent='Önce API anahtarını kaydet.';return}try{if(!rec){rec=new SR();rec.lang='tr-TR';rec.continuous=true;rec.interimResults=true;rec.onresult=async e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){let s=e.results[i][0].transcript.trim();if(e.results[i].isFinal)final+=s}if(final){let normalized=final.toLocaleLowerCase('tr-TR');if(awaitingWake){if(normalized.includes('ero')){awaitingWake=false;face.classList.add('listening');showText('ERO dinliyor…');let command=final.replace(/ero/ig,'').trim();if(command){face.classList.remove('listening');await handleUtterance(command);awaitingWake=true}else{say('Seni dinliyorum.');}}}else{face.classList.remove('listening');handleUtterance(final);awaitingWake=true}}};rec.onerror=e=>{$('info').textContent='Mikrofon: '+e.error+' (izin ve HTTPS kontrol et)';face.classList.remove('listening')};rec.onend=()=>{if(continuous)try{rec.start()}catch(e){}}}continuous=!continuous;if(continuous){rec.start();$('mic').textContent='Mikrofonu durdur';status.classList.add('on');face.classList.add('listening');$('info').textContent='Sürekli dinleme açık. “ERO” diye seslen.'}else{rec.stop();face.classList.remove('listening');status.classList.remove('on');$('mic').textContent='Mikrofonu başlat'}}catch(e){$('info').textContent='Mikrofon başlatılamadı: '+e.message}}
$('mic').onclick=startMic;$('stop').onclick=()=>speechSynthesis?.cancel();document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer.style.display='none'});
</script></body></html>
