<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020508"><title>ERO</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020508;color:#d9faff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{height:100dvh;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 50% 48%,#0a1b23 0%,#020508 70%)}.face{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:25px;touch-action:manipulation;user-select:none}.eyes{display:flex;gap:8vw;filter:drop-shadow(0 0 24px #47d8e877)}.eye{width:clamp(90px,25vw,170px);height:clamp(48px,12vw,82px);border-radius:52% 48% 45% 45%;position:relative;background:linear-gradient(180deg,#d8ffff,#72e7ef 52%,#0b7890);box-shadow:inset 0 -10px 20px #064b60;animation:breath 4s ease-in-out infinite}.eye:after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;height:73%;border-radius:50%;background:#020810;box-shadow:0 0 0 6px #d7ffff25}.eye.blink{animation:blink .18s}@keyframes blink{50%{transform:scaleY(.07)}}@keyframes breath{50%{filter:brightness(.9);transform:scale(.99)}}.mouth{width:48px;height:5px;border-radius:100%;background:#4bdde9;opacity:.5;box-shadow:0 0 14px #4bdde9;transition:height .1s,transform .1s}.mouth.talk{height:17px;opacity:.95;animation:talk .16s alternate infinite}@keyframes talk{to{transform:scaleX(1.4);height:9px}}.face.listen .eye{filter:brightness(1.2)}.wave{height:18px;display:flex;align-items:center;gap:3px;opacity:0;transition:opacity .2s}.wave.show{opacity:.8}.wave span{width:3px;height:3px;border-radius:4px;background:#58e2ec}.wave.show span{animation:wave .5s ease-in-out alternate infinite}.wave span:nth-child(3n){animation-delay:.13s}.wave span:nth-child(2n){animation-delay:.25s}@keyframes wave{to{height:18px}}#status{position:absolute;right:18px;top:calc(env(safe-area-inset-top)+14px);width:8px;height:8px;border-radius:50%;background:#64717c}#status.online{background:#4ade88;box-shadow:0 0 10px #4ade88}#status.listening{background:#55e0ee;box-shadow:0 0 12px #55e0ee;animation:wave .7s infinite alternate}.panel{display:none;position:absolute;bottom:12px;left:12px;right:12px;max-height:75dvh;overflow:auto;padding:16px;border:1px solid #2a3740;border-radius:18px;background:#10161df5;backdrop-filter:blur(10px)}.panel.open{display:block}.panel h3{margin:4px 0 15px}.panel label{display:block;color:#a5b1bc;font-size:13px;margin:12px 0 5px}.panel input,.panel textarea,.panel select{width:100%;padding:12px;border:1px solid #303a44;border-radius:11px;background:#03070b;color:#effcff;font-size:15px}.panel button{padding:11px 14px;border:1px solid #34404b;border-radius:11px;background:#1a242c;color:#f1fbff;margin:8px 6px 0 0}.statusline{font-size:12px;color:#a5b2bd;line-height:1.5;margin:10px 0}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.hint{font-size:11px;color:#7f8b95;line-height:1.4}.close{float:right}
</style></head><body><main><div id="status" title="ERO durumu"></div><div class="face" id="face"><div class="eyes"><div class="eye" id="eye1"></div><div class="eye" id="eye2"></div></div><div class="mouth" id="mouth"></div><div class="wave" id="wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
<section class="panel" id="panel"><button class="close" id="close">Kapat ✕</button><h3>ERO Gizli Ayarlar</h3><label>Gemini API anahtarı</label><input id="apikey" type="password" autocomplete="off" placeholder="API anahtarı"><label>Model</label><select id="model"><option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite (hızlı)</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option><option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option></select><label>ERO karakteri</label><textarea id="persona" rows="3">Sen ERO'sun. Türkçe, doğal, zeki ve kısa konuş. Genellikle 1-3 cümleyle yanıt ver. Sesli sohbet için konuşma dili kullan; gereksiz açıklama yapma.</textarea><button id="save">Ayarları kaydet</button><button id="test">Gemini bağlantısını test et</button><button id="mic">Dinlemeyi başlat/durdur</button><button id="stop">Sesi durdur</button><p id="msg" class="statusline">Yüze kısa dokun: dinlemeyi başlat/durdur. Yüze basılı tut: gizli menü. İlk mikrofon izni kullanıcı dokunuşuyla verilir.</p><p class="hint">Anahtar yalnızca bu tarayıcıdaki yerel kayıt alanında saklanır. Herkese açık GitHub Pages uygulamasında API anahtarının güvenliği garanti edilemez.</p></section></main>
<script>
(()=>{const $=id=>document.getElementById(id),face=$('face'),dot=$('status'),mouth=$('mouth'),wave=$('wave'),panel=$('panel'),msg=$('msg');let apiKey='',model='gemini-2.5-flash-lite',persona=$('persona').value,recognizer=null,listenWanted=false,listening=false,speaking=false,pressTimer=null,longPress=false,history=[];
function setStatus(mode){dot.className=mode||'';face.classList.toggle('listen',mode==='listening');wave.classList.toggle('show',mode==='listening'||speaking)}
function blink(){if(listening||speaking)return;for(const id of ['eye1','eye2']){const e=$(id);e.classList.remove('blink');void e.offsetWidth;e.classList.add('blink');setTimeout(()=>e.classList.remove('blink'),180)}}setInterval(blink,4000+Math.random()*3500);
function showPanel(){panel.classList.add('open');$('apikey').value=apiKey;$('model').value=model;$('persona').value=persona}function hidePanel(){panel.classList.remove('open')}
function load(){try{const v=JSON.parse(localStorage.getItem('ero-settings')||'{}');apiKey=v.apiKey||'';model=v.model||model;persona=v.persona||persona;$('apikey').value=apiKey;$('model').value=model;$('persona').value=persona;if(apiKey)setStatus('online')}catch{}}
function save(){apiKey=$('apikey').value.trim();model=$('model').value;persona=$('persona').value.trim()||persona;try{localStorage.setItem('ero-settings',JSON.stringify({apiKey,model,persona}));msg.textContent='Ayarlar kaydedildi ve bu cihazda kalıcı.';if(apiKey)setStatus('online')}catch(e){msg.textContent='Kaydedilemedi: '+e.message}}
function stopSpeech(){speechSynthesis.cancel();speaking=false;mouth.classList.remove('talk');if(listenWanted)restartListening()}
function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();speaking=true;mouth.classList.add('talk');wave.classList.add('show');if(recognizer&&listening){try{recognizer.stop()}catch{}}const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=1.08;u.pitch=.96;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(voice)u.voice=voice;u.onend=()=>{speaking=false;mouth.classList.remove('talk');if(listenWanted)restartListening()};speechSynthesis.speak(u)}
function restartListening(){if(!listenWanted||speaking||!recognizer)return;setTimeout(()=>{if(listenWanted&&!speaking&&!listening)try{recognizer.start()}catch{}},450)}
async function ask(text){if(!apiKey){showPanel();msg.textContent='Önce Gemini anahtarını girip kaydet.';return}history.push({role:'user',parts:[{text}]});history=history.slice(-6);const models=[model,'gemini-2.5-flash-lite','gemini-2.5-flash','gemini-2.0-flash-lite'].filter((x,i,a)=>a.indexOf(x)===i);let lastError='';for(const m of models){try{const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({systemInstruction:{parts:[{text:persona}]},contents:history,generationConfig:{maxOutputTokens:160,temperature:.65}})});const data=await response.json();if(!response.ok){lastError=data.error?.message||('HTTP '+response.status);if(response.status===404||response.status===400){continue}throw Error(lastError)}const answer=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim()||'Yanıt üretemedim.';history.push({role:'model',parts:[{text:answer}]});msg.textContent='';speak(answer);return}catch(e){lastError=e.message;break}}msg.textContent='Gemini yanıt hatası: '+lastError;setStatus('')}
function handleTranscript(text){text=(text||'').trim();if(!text)return;const low=text.toLocaleLowerCase('tr-TR');if(/^ero[,.!? ]*$/i.test(low)){speak('Buradayım, dinliyorum.');return}let command=text.replace(/^ero[,.!? ]*/i,'').trim();if(!command)command=text;ask(command)}
function startMic(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){msg.textContent='Chrome ses tanımayı desteklemiyor. Chrome HTTPS üzerinden aç.';showPanel();return}if(listenWanted){listenWanted=false;try{recognizer.stop()}catch{}setStatus('');msg.textContent='Dinleme kapatıldı.';return}listenWanted=true;recognizer=new Speech();recognizer.lang='tr-TR';recognizer.continuous=true;recognizer.interimResults=false;recognizer.maxAlternatives=1;recognizer.onstart=()=>{listening=true;setStatus('listening');msg.textContent='Mikrofon açık. “ERO” diyebilir veya direkt konuşabilirsin.'};recognizer.onend=()=>{listening=false;if(listenWanted&&!speaking)restartListening();else if(!listenWanted)setStatus(apiKey?'online':'')};recognizer.onerror=e=>{msg.textContent='Mikrofon: '+e.error;if(e.error==='not-allowed'||e.error==='service-not-allowed'){listenWanted=false;showPanel();msg.textContent='Mikrofon izni reddedildi. Siteyi HTTPS üzerinden açıp Chrome izinlerinden mikrofonu aç.'}};recognizer.onresult=e=>{const text=e.results[e.results.length-1][0].transcript;handleTranscript(text)};try{recognizer.start()}catch(e){listenWanted=false;msg.textContent='Mikrofon başlatılamadı. Chrome izinlerini kontrol et.'}}
$('save').onclick=save;$('test').onclick=async()=>{save();msg.textContent='Gemini bağlantısı test ediliyor…';try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({contents:[{parts:[{text:'Tek kelime OK yanıtla.'}]}],generationConfig:{maxOutputTokens:6,temperature:0}})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'HTTP '+r.status);setStatus('online');msg.textContent='Gemini bağlantısı başarılı: '+model}catch(e){setStatus('');msg.textContent='Bağlantı hatası: '+e.message}};$('mic').onclick=startMic;$('stop').onclick=stopSpeech;$('close').onclick=hidePanel;
face.addEventListener('click',()=>{if(longPress){longPress=false;return}startMic()});face.addEventListener('touchstart',()=>{longPress=false;pressTimer=setTimeout(()=>{longPress=true;showPanel()},700)},{passive:true});face.addEventListener('touchend',()=>clearTimeout(pressTimer));face.addEventListener('contextmenu',e=>{e.preventDefault();showPanel()});load();})();
</script></body></html>
